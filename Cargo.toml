[workspace]
members = ["crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
jsonc-parser = "=0.34.0"
num-bigint = "=0.4.6"
clap = { version = "=4.5.50", features = ["derive"] }
tempfile = "=3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

